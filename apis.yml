aid: ethossystems
name: Ethos Systems
description: 'Ethos Systems is an AI-powered human readiness platform that unifies learning, performance,
  and outcomes management in a single system built for enterprise and government deployment across both
  commercial and classified networks. Founded in 2019 and headquartered in Redwood City, California, Ethos
  delivers personalized training with algorithm-driven interventions, rapid AI content development, and
  real-time readiness dashboards that connect learning to operational outcomes. It serves the U.S. military,
  federal civilian agencies, life sciences, manufacturing, freight and logistics, hospitality, athletics,
  utilities, insurance, and government contractors, and is backed by Norwest Venture Partners, the Westly
  Group, and Pear VC. The company operates the Ethos and Learn to Win platforms; its developer and product
  documentation is gated behind authentication and it exposes no public REST API, OpenAPI specification,
  or developer portal at this time.'
